  #   label: mine
  # The optional "reworded prompt" control (triage_v0_reworded.txt) is NOT informative with the stand-in:
  # it follows fixed rules, so a rewording tells you nothing about a real model. Skip that step here.

providers:
  - id: file://practice_provider.js
    label: practice stand-in

tests: file://tests.yaml
